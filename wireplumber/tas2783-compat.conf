# HP 8EA1: the "Pro Audio" probe opens the TAS2783 I/V-sense capture, which
# fails with -22 and floods the kernel log. UCM HiFi covers every device.

monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.card.name = "amd-soundwire"
        api.alsa.card.longname = "~.*-8EA1$"
      }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
      }
    }
  }
]
